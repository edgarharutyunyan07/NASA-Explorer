server.port=8080

# NASA Image and Video Library - https://images-api.nasa.gov - no key needed, fully public

# Groq API - https://console.groq.com/keys
groq.api.key=${GROQ_API_KEY:}

# H2 database - saved to ./data/tumo.mv.db (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/tumo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Jackson 3 fails on JSON null for primitives by default; keep the pre-Boot-4 behaviour (null -> 0)
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Browse the DB at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/tumo)
spring.h2.console.enabled=true
